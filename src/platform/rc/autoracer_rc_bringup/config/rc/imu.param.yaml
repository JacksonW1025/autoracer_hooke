IMU_publisher:
  ros__parameters:
    baud_rate: 115200
    frame_id: imu_link
    imu_switch: true
    imu_topic: /sensing/imu/raw/imu_data
    euler_switch: false
    magnetic_switch: false
    temperature_switch: false
    pressure_switch: false

imu_qos_adapter:
  ros__parameters:
    # Conservative RC platform floor for the HIPNUC driver, which reports
    # unknown angular-velocity covariance as all zeros. Outdoor calibration
    # may replace this value; zero must never reach gyro_odometer/EKF.
    fallback_angular_velocity_stddev_radps: 0.02
