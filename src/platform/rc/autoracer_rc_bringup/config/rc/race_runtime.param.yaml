race_runtime_manager:
  ros__parameters:
    update_rate_hz: 20.0
    # Launching the full RC graph only prepares the system. The operator must
    # explicitly call /autoracer/race/start after the entry reports READY.
    auto_start: false
    startup_timeout_sec: 90.0
    localization_timeout_sec: 0.20
    trajectory_timeout_sec: 0.35
    control_timeout_sec: 0.20
    velocity_status_timeout_sec: 1.75
    vehicle_status_timeout_sec: 0.25
    stop_speed_mps: 0.10
    service_retry_sec: 0.25
    emergency_acceleration_mps2: -2.4
