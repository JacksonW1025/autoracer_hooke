rc_vehicle_interface:
  ros__parameters:
    serial_port: /dev/autoracer_rc_chassis
    baud_rate: 115200
    maximum_command_speed_mps: 3.0
    minimum_command_speed_mps: 0.3
    max_steering_tire_angle_rad: 0.262
    firmware_command_timeout_ms: 250
    serial_poll_period_ms: 10
    reconnect_period_ms: 1000
    base_frame_id: base_link
