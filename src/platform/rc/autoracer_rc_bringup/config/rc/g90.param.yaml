# Stage 4 keeps this false: the current maps use a Local projector and the
# antenna transform, mount angle, and yaw covariance have not been measured.
# 4P may enable it only with a georeferenced map and approved calibration.
/g90/g90_nmea_adapter:
  ros__parameters:
    frame_id: gnss_link
    base_frame: base_link
    enable_localization_output: false
    # Prefer status-bearing THS. Statusless HDT requires separate 4P evidence.
    allow_statusless_hdt: false
    heading_mount_offset_deg: 0.0
    heading_max_age_sec: 0.3
    gst_max_age_sec: 0.5
    fix_timeout_sec: 0.5
    yaw_stddev_deg: 0.0
    roll_pitch_stddev_deg: 180.0
