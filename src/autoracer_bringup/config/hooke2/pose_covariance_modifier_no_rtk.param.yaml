/**:
  ros__parameters:
    # CarMaker no-RTK GNSS is intentionally ~3 m RMS; use GNSS as a weak EKF anchor.
    threshold_gnss_stddev_yaw_deg_max: 20.0
    threshold_gnss_stddev_z_max: 10.0
    threshold_gnss_stddev_xy_bound_lower: 0.5
    threshold_gnss_stddev_xy_bound_upper: 5.0
    ndt_std_dev_bound_lower: 0.14
    ndt_std_dev_bound_upper: 0.30
    gnss_pose_timeout_sec: 1.0
    enable_debug_topics: true
