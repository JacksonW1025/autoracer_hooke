/**:
  ros__parameters:
    # Compare NDT motion with the existing gyro-odometer over a causal window.
    anchor_interval_sec: 5.0
    anchor_history_sec: 20.0
    max_xy_innovation_m: 0.2
    max_yaw_innovation_deg: 0.15
    gross_xy_innovation_m: 0.6
    gross_yaw_innovation_deg: 2.0
    yaw_rate_allowance_sec: 0.06
    violation_hold_sec: 0.2

    recovery_xy_innovation_m: 0.12
    recovery_yaw_innovation_deg: 0.2
    recovery_hold_sec: 5.0
    recovery_consistency_window_sec: 5.0
    recovery_consistency_min_samples: 30
    recovery_consistency_max_xy_spread_m: 0.15
    recovery_consistency_max_yaw_spread_deg: 0.5

    # The active profile may use the stock 200-particle ndt_align service when
    # direct innovation recovery is deadlocked by bounded odometry drift.
    enable_ndt_relocalization: false
    ndt_align_service_topic: /localization/pose_estimator/ndt_align_srv
    relocalization_min_degraded_sec: 5.0
    relocalization_retry_sec: 15.0
    relocalization_window_max_xy_spread_m: 0.1
    relocalization_window_max_yaw_spread_deg: 0.2
    relocalization_search_xy_stddev_m: 0.5
    relocalization_search_z_stddev_m: 0.15
    relocalization_search_rp_stddev_deg: 1.5
    relocalization_search_yaw_stddev_deg: 15.0
    relocalization_max_correction_m: 0.75
    relocalization_max_correction_yaw_deg: 1.0
    relocalization_confirmation_xy_m: 0.15
    relocalization_confirmation_yaw_deg: 0.2
    relocalization_confirmation_hold_sec: 0.5
    relocalization_confirmation_timeout_sec: 3.0
    max_twist_age_sec: 0.25

    # In degraded state, publish the bounded wheel/IMU prediction. Recovery
    # requires either a strict 5 s hold or a consistent 5 s window whose
    # current correction is still bounded by the strict innovation limits.
