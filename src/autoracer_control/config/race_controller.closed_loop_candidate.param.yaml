/**:
  ros__parameters:
    lateral_controller_mode: "mpc"
    longitudinal_controller_mode: "pid"
    ego_nearest_dist_threshold: 3.0
    ego_nearest_yaw_threshold: 1.046
    enable_control_cmd_horizon_pub: false

    # seeded from chassis manual steering response time; ROS-only low-speed candidate
    input_delay: 0.15
    vehicle_model_steer_tau: 0.27

    # 4 s prediction window at 0.1 s, within the planned 3-5 s range
    mpc_prediction_horizon: 40
    mpc_prediction_dt: 0.1

    # low-speed seed weights; Phase 5 may tune one parameter class per round
    mpc_weight_lat_error: 20.0
    mpc_weight_heading_error: 3.0
    mpc_weight_heading_error_squared_vel: 0.8
    mpc_weight_steering_input: 0.05
    mpc_weight_steering_input_squared_vel: 0.02
    mpc_weight_steer_rate: 0.02
    mpc_weight_steer_acc: 0.000001
    mpc_weight_terminal_lat_error: 30.0
    mpc_weight_terminal_heading_error: 5.0

    # controller-side steer-rate limits; plant limits remain in launch/node parameters
    steer_rate_lim_dps_list_by_curvature: [55.0, 50.0, 45.0]
    curvature_list_for_steer_rate_lim: [0.001, 0.02, 0.05]
    steer_rate_lim_dps_list_by_velocity: [60.0, 55.0, 50.0, 45.0]
    velocity_list_for_steer_rate_lim: [0.0, 1.0, 2.0, 3.0]

    publish_debug_trajectories: false

    # longitudinal PID low-speed guardrail seed; plant limits are not declared here
    delay_compensation_time: 0.15
    kp: 1.0
    ki: 0.1
    kd: 0.0
    max_out: 1.0
    min_out: -1.0
    max_acc: 1.0
    min_acc: -2.0
    max_jerk: 2.0
    min_jerk: -4.0
    max_acc_cmd_diff: 4.0
